services:
  - type: web
    name: gono-university-chatbot-api
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run api
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: PORT
        value: 8787
      - key: HOST
        value: 0.0.0.0
      - key: OFFICIAL_SITE_URL
        value: https://gonouniversity.edu.bd/
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_PROVIDER_NAME
        value: Groq
